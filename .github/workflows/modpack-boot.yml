name: modpack-boot

# Boots one curated modpack per day (all the MC versions it builds for) to catch
# packs that crash despite Modrinth's author-set server_side:required tag. Runs on
# a plain runner via `quackvps bootcheck` — no systemd, ufw, or caddy.

on:
  schedule:
    - cron: "0 9 * * *" # daily, 09:00 UTC = 04:00 EST
  workflow_dispatch:
    inputs:
      slug:
        description: "Single pack to test (leave blank to test the day's scheduled pack)"
        required: false
        default: ""
      loader:
        description: "Loader for the single pack"
        required: false
        default: "neoforge"
      mc:
        description: "MC version for the single pack"
        required: false
        default: ""
      java:
        description: "Java major for the single pack"
        required: false
        default: "21"

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      loader: ${{ steps.pick.outputs.loader }}
      slug: ${{ steps.pick.outputs.slug }}
      matrix: ${{ steps.pick.outputs.matrix }}
      count: ${{ steps.pick.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"
      - run: go build -o quackvps ./cmd/quackvps

      - id: pick
        run: |
          if [ -n "${{ inputs.slug }}" ]; then
            # A manual single-pack run: build a one-entry matrix from the inputs.
            loader='${{ inputs.loader }}'
            slug='${{ inputs.slug }}'
            matrix=$(jq -cn --arg mc '${{ inputs.mc }}' --argjson java '${{ inputs.java }}' '[{mc:$mc,java:$java}]')
          else
            # The scheduled path: pick the day's pack and the versions it builds for.
            out=$(./quackvps ci-pack --day "$(date +%j)")
            loader=$(echo "$out" | jq -r .loader)
            slug=$(echo "$out" | jq -r .slug)
            matrix=$(echo "$out" | jq -c .matrix)
          fi
          {
            echo "loader=$loader"
            echo "slug=$slug"
            echo "matrix=$matrix"
            echo "count=$(echo "$matrix" | jq 'length')"
          } >> "$GITHUB_OUTPUT"

  boot:
    needs: select
    if: needs.select.outputs.count != '0'
    runs-on: ubuntu-latest
    name: boot ${{ matrix.pack.mc }}
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        pack: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: jlumbroso/free-disk-space@main
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"
      - run: go build -o quackvps ./cmd/quackvps
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.pack.java }}

      - id: boot
        run: |
          set +e
          ./quackvps bootcheck \
            --loader "${{ needs.select.outputs.loader }}" \
            --modpack "${{ needs.select.outputs.slug }}" \
            --mc "${{ matrix.pack.mc }}" \
            --dir "$RUNNER_TEMP/srv" \
            --java "$JAVA_HOME/bin/java" \
            --timeout 15m \
            --reason-file "$RUNNER_TEMP/reason.txt"
          code=$?
          if [ $code -eq 0 ]; then
            row="| ${{ needs.select.outputs.slug }} | ${{ matrix.pack.mc }} | ${{ matrix.pack.java }} | ✅ booted | — |"
          else
            reason=$(head -1 "$RUNNER_TEMP/reason.txt" 2>/dev/null)
            [ -z "$reason" ] && reason="failed to boot"
            row="| ${{ needs.select.outputs.slug }} | ${{ matrix.pack.mc }} | ${{ matrix.pack.java }} | ❌ failed | $reason |"
          fi
          echo "$row" > "$RUNNER_TEMP/result.md"
          echo "$row" >> "$GITHUB_STEP_SUMMARY"
          exit $code

      # Always keep the row, even on failure, so the report job can collate it.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.pack.mc }}
          path: ${{ runner.temp }}/result.md

      # On failure, keep the full server log so a red row can be diagnosed by
      # downloading it, no need to re-run anything.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ matrix.pack.mc }}
          path: ${{ runner.temp }}/srv/logs/latest.log
          if-no-files-found: ignore

  report:
    needs: [select, boot]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: result-*
          merge-multiple: true
          path: results
      - run: |
          # Each result-*.md artifact is exactly one version's row, so the file
          # count is the versions tested and the ones containing ❌ are the failures.
          total=$(ls results/*.md 2>/dev/null | wc -l | tr -d ' ')
          failed=$(grep -l '❌' results/*.md 2>/dev/null | wc -l | tr -d ' ')
          {
            echo "## Modpack boot test — ${{ needs.select.outputs.slug }} (${{ needs.select.outputs.loader }})"
            echo ""
            echo "| pack | mc | java | result | reason |"
            echo "|------|----|------|--------|--------|"
            cat results/*.md 2>/dev/null || echo "| — | — | — | no results | — |"
            echo ""
            if [ "$total" -gt 0 ]; then
              echo "**$((total - failed))/$total booted — $failed failed ($((failed * 100 / total))% of versions).**"
            else
              echo "**No versions tested (the pack had no buildable, unparked versions).**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned, not `stable`: golangci-lint can only typecheck stdlib from the Go
      # release it was built with, so these two versions have to move together.
      # A new Go major under a stale lint pin fails on GOROOT, not on this repo.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"

      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.1 # built with go1.27.0
      - run: go build ./...
      - run: go test ./...

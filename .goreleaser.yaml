version: 2

builds:
  - main: ./cmd/quackvps
    binary: quackvps
    env:
      - CGO_ENABLED=0
    # Stamp the tag into cli.Version; without this every build reports "dev".
    # -s -w keeps the default stripping that specifying ldflags would drop.
    ldflags:
      - -s -w -X github.com/rvhoyos/quackvps/internal/cli.Version={{ .Version }}
    goos:
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - formats:
      - binary
    name_template: "{{ .Binary }}-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: checksums.txt
